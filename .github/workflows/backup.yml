name: Database Backup

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Checkout backup repo
        uses: actions/checkout@v4
        with:
          repository: Awais-Nazir/hisab-kitab-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}

      - name: Dump database
        run: pg_dump -Fc -d "${{ secrets.DATABASE_URL_UNPOOLED }}" -f backup-$(date +%F).bak

      - name: Commit backup
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backup-$(date +%F).bak
          git commit -m "Backup $(date +%F)"
          git push