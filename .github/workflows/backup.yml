name: Database Backup

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client 18
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo wget --quiet -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> $GITHUB_PATH

      - name: Checkout backup repo
        uses: actions/checkout@v4
        with:
          repository: Awais-Nazir/hisab-kitab-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}

      - name: Dump database
        run: pg_dump -Fc -d "${{ secrets.DATABASE_URL_UNPOOLED }}" -f backup-$(date +%F).bak

      - name: Commit backup
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backup-$(date +%F).bak
          git commit -m "Backup $(date +%F)"
          git push